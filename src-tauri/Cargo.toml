[package]
name = "app"
version = "0.3.0"
description = "Reproductor local de anime, control-first, para Steam Machine"
authors = ["Giomar Osorio"]
license = ""
repository = "https://github.com/GiomarOsorio/AnimeAppImage"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "fs", "time", "sync"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tiny_http = "0.12"
regex = "1"
dirs = "5"
percent-encoding = "2"
rand = "0.8"
chrono = "0.4"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
